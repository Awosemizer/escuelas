    <style>
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #FFFFFF; }
      #boot svg { display: block; }
      /* v3.2 · pantalla de carga del Tema (public/tema-boot.js y src/theme/TemaLoader.tsx) */
      .tema-loader { display: grid; place-items: center; min-height: 240px; }
      .tema-loader.fill { position: fixed; inset: 0; z-index: 900; }
      .tema-retry { position: fixed; left: 50%; bottom: calc(32px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 901; }
      .tb { display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; animation: tb-in .35s ease both; }
      .tb-logo { width: 96px; height: 96px; object-fit: contain; border-radius: 22px; }
      .tb-text { font-size: 30px; line-height: 1.1; letter-spacing: -.01em; max-width: 80vw; }
      .tb-phrase { margin: 0; font: 500 14px/1.4 system-ui, sans-serif; opacity: .72; max-width: 80vw; }
      .tb-anim { display: flex; gap: 7px; height: 14px; align-items: center; }
      .tb-anim i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; opacity: .85; }
      .tb-pulso .tb-logo, .tb-pulso .tb-text { animation: tb-pulse 1.4s ease-in-out infinite; }
      .tb-barra .tb-anim i + i { display: none; }
      .tb-pulso .tb-anim { display: none; }
      .tb-giro .tb-anim { display: block; width: 30px; height: 30px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: tb-spin .8s linear infinite; }
      .tb-giro .tb-anim i { display: none; }
      .tb-rebote .tb-logo, .tb-rebote .tb-text { animation: tb-bounce 1s ease-in-out infinite; }
      .tb-rebote .tb-anim { display: none; }
      .tb-barra .tb-anim { display: block; width: 160px; height: 4px; border-radius: 4px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; position: relative; }
      .tb-barra .tb-anim i:first-child { display: block; position: absolute; inset: 0 auto 0 0; width: 40%; height: 100%; border-radius: 4px; animation: tb-bar 1.2s ease-in-out infinite; }
      .tb-puntos .tb-anim i { animation: tb-dot 1.1s ease-in-out infinite; }
      .tb-puntos .tb-anim i:nth-child(2) { animation-delay: .15s; } .tb-puntos .tb-anim i:nth-child(3) { animation-delay: .3s; }
      @keyframes tb-in { from { opacity: 0; transform: translateY(6px); } }
      @keyframes tb-pulse { 50% { transform: scale(.94); opacity: .7; } }
      @keyframes tb-spin { to { transform: rotate(360deg); } }
      @keyframes tb-bounce { 50% { transform: translateY(-10px); } }
      @keyframes tb-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      @keyframes tb-dot { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .tb *, .tb { animation: none !important; } }
    </style>
